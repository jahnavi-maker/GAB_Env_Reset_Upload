<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Environment Reset</title>
<style>
  :root {
    --bg: #f6f3f0; --card: #ffffff; --ink: #111113; --muted: #6b6b70;
    --brand: #175fff; --ok: #12855a; --err: #c0392b; --line: #e6e2dd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111113; --card:#1b1b1e; --ink:#f6f3f0; --muted:#9a9aa0; --line:#2c2c30; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 40px 32px; width: 100%; max-width: 440px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.06);
  }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
  .target { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .target b { color: var(--ink); font-weight: 600; }
  button {
    appearance: none; border: 0; cursor: pointer; width: 100%;
    background: var(--brand); color: #fff; font-size: 16px; font-weight: 600;
    padding: 16px; border-radius: 12px; transition: opacity .15s, transform .05s;
  }
  button:hover { opacity: .92; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: default; }
  .result { margin-top: 24px; text-align: left; display: none; }
  .result.show { display: block; }
  .row { font-size: 13px; margin: 8px 0; color: var(--muted); }
  .row .val { color: var(--ink); font-weight: 600; word-break: break-all; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
  .status.running { color: var(--brand); }
  .status.completed { color: var(--ok); }
  .status.failed { color: var(--err); }
  .spinner {
    width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err-detail { color: var(--err); font-size: 12px; margin-top: 6px; }
  code { background: rgba(127,127,127,.12); padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Environment Reset</h1>
    <div class="target">Resetting <b id="email">—</b> · persona <b id="persona">—</b></div>
    <button id="resetBtn">Reset</button>

    <div class="result" id="result">
      <div class="row">Reset ID<br><span class="val" id="sid">—</span></div>
      <div class="row">Status<br><span id="statusWrap" class="status">—</span></div>
      <div class="err-detail" id="errDetail"></div>
    </div>
  </div>

<script>
  // Identity comes from the page URL, e.g.
  //   /?email=...&persona=Student&task_allocation_id=...
  // With no params, defaults to the Student test account so the page is testable.
  const q = new URLSearchParams(location.search);
  const ctx = {
    email: q.get("email") || "geminiapp.gab.demo.user410@gmail.com",
    persona: q.get("persona") || "Student",
    task_allocation_id: q.get("task_allocation_id") || "manual-ui-test",
  };
  document.getElementById("email").textContent = ctx.email;
  document.getElementById("persona").textContent = ctx.persona;

  const btn = document.getElementById("resetBtn");
  const result = document.getElementById("result");
  const sidEl = document.getElementById("sid");
  const statusWrap = document.getElementById("statusWrap");
  const errDetail = document.getElementById("errDetail");

  function renderStatus(status) {
    statusWrap.className = "status " + status;
    if (status === "running" || status === "queued" || status === "in_progress") {
      statusWrap.innerHTML = '<span class="spinner"></span> Resetting…';
    } else if (status === "completed") {
      statusWrap.textContent = "✅ Completed";
    } else if (status === "failed") {
      statusWrap.textContent = "❌ Failed";
    } else {
      statusWrap.textContent = status;
    }
  }

  async function poll(id) {
    try {
      const r = await fetch("/ui/reset/" + id);
      const d = await r.json();
      renderStatus(d.status);
      if (d.status === "completed" || d.status === "failed") {
        if (d.error) errDetail.textContent = d.error;
        btn.disabled = false;
        btn.textContent = "Reset again";
        return;
      }
    } catch (e) { /* transient; keep polling */ }
    setTimeout(() => poll(id), 1500);
  }

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    btn.textContent = "Resetting…";
    errDetail.textContent = "";
    result.classList.add("show");
    renderStatus("running");
    sidEl.textContent = "…";
    try {
      const r = await fetch("/ui/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(ctx),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      sidEl.textContent = d.reset_session_id;
      poll(d.reset_session_id);
    } catch (e) {
      renderStatus("failed");
      errDetail.textContent = "Could not start reset: " + e.message;
      btn.disabled = false;
      btn.textContent = "Reset";
    }
  });
</script>
</body>
</html>
