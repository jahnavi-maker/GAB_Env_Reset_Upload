<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GAB Environment Reset</title>
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2b3340; --ink:#e6edf3;
    --muted:#8b949e; --brand:#3b82f6; --ok:#2ea043; --warn:#d29922; --err:#f85149;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; font-size:14px; }
  header { padding:20px 28px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:14px; }
  header h1 { font-size:18px; margin:0; letter-spacing:-.01em; }
  header .sub { color:var(--muted); font-size:13px; }
  .wrap { padding:24px 28px; max-width:1100px; margin:0 auto; }
  .eyebrow { color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-size:11px; font-weight:700; margin:24px 0 10px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:12px; background:var(--panel2); }
  tr:last-child td { border-bottom:0; }
  code { background:rgba(255,255,255,.06); padding:1px 6px; border-radius:5px; font-size:12px; }
  .chip { display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; }
  .chip.ok { background:rgba(46,160,67,.15); color:#3fb950; }
  .chip.no { background:rgba(139,148,158,.15); color:var(--muted); }
  .chip.completed { background:rgba(46,160,67,.15); color:#3fb950; }
  .chip.running, .chip.queued { background:rgba(59,130,246,.15); color:#6ea8fe; }
  .chip.failed { background:rgba(248,81,73,.15); color:#ff7b72; }
  .chip.upload { background:rgba(210,153,34,.15); color:#e3b341; }
  .chip.delta { background:rgba(59,130,246,.15); color:#6ea8fe; }
  .chip.reseed { background:rgba(210,153,34,.15); color:#e3b341; }
  select, button { font:inherit; }
  select { background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  button.act { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:7px 14px; font-weight:600; cursor:pointer; }
  button.act:hover { opacity:.92; } button.act:disabled { opacity:.45; cursor:default; }
  .muted { color:var(--muted); }
  .op { font-size:11px; color:var(--muted); margin-top:3px; }
  .row-actions { display:flex; gap:8px; align-items:center; justify-content:flex-end; }
  .refresh { margin-left:auto; background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
  .empty { padding:20px 14px; color:var(--muted); }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  .spinner { width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;
    display:inline-block;animation:spin .7s linear infinite;vertical-align:-1px;margin-right:5px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <header>
    <h1>GAB Environment Reset</h1>
    <span class="sub">accounts from <code>gab_accounts</code> · operations logged to <code>reset_sessions</code></span>
    <button class="refresh" id="refresh">Refresh</button>
  </header>
  <div class="wrap">
    <div class="eyebrow">Accounts</div>
    <table id="accts">
      <thead><tr>
        <th>Account</th><th>Current persona</th><th>Authorized</th><th>Last reset</th>
        <th style="width:320px"></th>
      </tr></thead>
      <tbody><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
    </table>

    <div class="eyebrow">Recent operations</div>
    <table id="ops">
      <thead><tr>
        <th>When</th><th>Account</th><th>Persona</th><th>Op</th><th>Status</th><th>Task ID</th>
      </tr></thead>
      <tbody><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>

<script>
  const PERSONAS = [
    "Student","Applied_ML_and_data_scientist","Startup_founder","Educator_and_instructional_designer",
    "Backend_software_engineer","Legal_and_contracts_analyst","Luxury_travel_advisor","Indie_game_designer",
    "Life_Sciences_Researcher","Creative_producer_and_marketer","Ghostwriter_and_nonfiction_author",
    "Household_manager_and_parent","Independent_consultant","Independent_financial_planner",
    "Residential_real_estate_agent","Solo_operator_and_owner","Travel_and_trip_planner"
  ];
  const fmt = t => t ? new Date(t).toLocaleString() : "—";

  function personaSelect(email, current) {
    const opts = PERSONAS.map(p => `<option value="${p}" ${p===current?"selected":""}>${p}</option>`).join("");
    return `<select data-email="${email}">${opts}</select>`;
  }

  async function loadAccounts() {
    const tb = document.querySelector("#accts tbody");
    let rows = [];
    try { rows = await (await fetch("/ui/accounts")).json(); } catch(e) {}
    if (!rows.length) { tb.innerHTML = `<tr><td colspan="5" class="empty">No accounts yet — authorize + push in the seeder to populate <code>gab_accounts</code>.</td></tr>`; return; }
    tb.innerHTML = rows.map(r => {
      const cur = r.last_reset_persona || r.persona;
      const willBe = "reset (same persona)";
      return `<tr data-email="${r.email}">
        <td class="mono">${r.email}</td>
        <td><code>${cur}</code></td>
        <td><span class="chip ${r.authorized?'ok':'no'}">${r.authorized?'yes':'no'}</span></td>
        <td class="muted">${fmt(r.last_reset_at)}</td>
        <td><div class="row-actions">
          ${personaSelect(r.email, cur)}
          <button class="act" data-email="${r.email}" data-current="${cur}" ${r.authorized?'':'disabled title="authorize first"'}>Reset</button>
        </div><div class="op" data-op="${r.email}"></div></td>
      </tr>`;
    }).join("");
    tb.querySelectorAll("button.act").forEach(b => b.addEventListener("click", onReset));
  }

  async function loadOps() {
    const tb = document.querySelector("#ops tbody");
    let rows = [];
    try { rows = await (await fetch("/ui/sessions")).json(); } catch(e) {}
    if (!rows.length) { tb.innerHTML = `<tr><td colspan="6" class="empty">No operations yet.</td></tr>`; return; }
    tb.innerHTML = rows.map(r => `<tr>
      <td class="muted">${fmt(r.created_at || r.started_at)}</td>
      <td class="mono">${r.email}</td>
      <td><code>${r.persona||''}</code></td>
      <td><span class="chip ${r.mode||''}">${r.mode||'—'}</span></td>
      <td><span class="chip ${r.status}">${r.status}</span></td>
      <td class="mono muted">${(r.task_allocation_id||'').slice(0,22)}</td>
    </tr>`).join("");
  }

  async function onReset(ev) {
    const btn = ev.currentTarget;
    const email = btn.dataset.email;
    const current = btn.dataset.current;
    const sel = document.querySelector(`select[data-email="${email}"]`);
    const persona = sel ? sel.value : current;
    const opEl = document.querySelector(`[data-op="${email}"]`);
    const switching = persona !== current;
    btn.disabled = true;
    opEl.innerHTML = `<span class="spinner"></span>${switching ? 'reseeding new persona…' : 'resetting…'}`;
    try {
      const r = await fetch("/ui/reset", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ email, persona, task_allocation_id: "dashboard-"+Date.now() })
      });
      if (!r.ok) throw new Error("HTTP "+r.status);
      const d = await r.json();
      poll(email, d.reset_session_id, opEl, btn);
    } catch(e) {
      opEl.innerHTML = `<span class="muted">failed to start: ${e.message}</span>`;
      btn.disabled = false;
    }
  }

  async function poll(email, id, opEl, btn) {
    try {
      const d = await (await fetch("/ui/reset/"+id)).json();
      if (d.status==="completed" || d.status==="failed") {
        opEl.innerHTML = d.status==="completed"
          ? `<span style="color:#3fb950">✓ done</span> <span class="mono muted">${id.slice(0,8)}</span>`
          : `<span style="color:#ff7b72">✗ ${(d.error||'failed').slice(0,80)}</span>`;
        btn.disabled = false;
        loadOps();
        return;
      }
      opEl.innerHTML = `<span class="spinner"></span>${d.status}…`;
    } catch(e) {}
    setTimeout(()=>poll(email,id,opEl,btn), 2000);
  }

  function refreshAll(){ loadAccounts(); loadOps(); }
  document.getElementById("refresh").addEventListener("click", refreshAll);
  refreshAll();
  setInterval(loadOps, 10000);
</script>
</body>
</html>
