<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restore progress</title>
<style>
  :root {
    --bg:#f6f3f0; --card:#ffffff; --ink:#111113; --muted:#6b6b70;
    --brand:#175fff; --ok:#12855a; --err:#c0392b; --line:#e6e2dd; --chip:#eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#111113; --card:#1b1b1e; --ink:#f6f3f0; --muted:#9a9aa0; --line:#2c2c30; --chip:#23232a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
    display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px;
    width:100%; max-width:440px; box-shadow:0 10px 40px rgba(0,0,0,.06); overflow:hidden; }
  .pad { padding:26px 26px; }
  .divider { border-top:1px solid var(--line); }
  h1 { font-size:22px; margin:0 0 4px; letter-spacing:-.01em; }
  .subtle { color:var(--muted); font-size:13px; margin:0; }
  .field { margin-bottom:14px; }
  .field:last-child { margin-bottom:0; }
  .label { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:3px; }
  .value { font-size:14px; font-weight:600; word-break:break-all; }
  .value.empty { color:var(--muted); font-weight:400; }
  .value.mono { font-family:ui-monospace,Menlo,monospace; letter-spacing:.02em; }
  .rowtop { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .pill { font-size:11px; font-weight:800; letter-spacing:.05em; padding:5px 11px; border-radius:999px; text-transform:uppercase; }
  .pill.queued { background:var(--chip); color:var(--muted); }
  .pill.running { background:rgba(23,95,255,.12); color:var(--brand); }
  .pill.completed { background:rgba(18,133,90,.12); color:var(--ok); }
  .pill.failed { background:rgba(192,57,43,.12); color:var(--err); }
  .track { height:8px; background:var(--chip); border-radius:999px; overflow:hidden; margin:2px 0 8px; }
  .track > div { height:100%; background:var(--brand); width:0; transition:width .4s ease; }
  .track.completed > div { background:var(--ok); }
  .track.failed > div { background:var(--err); }
  .pcline { display:flex; justify-content:space-between; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px; }
  .steps { list-style:none; margin:14px 0 0; padding:0; }
  .steps li { display:flex; align-items:center; gap:12px; padding:9px 0; font-size:15px; }
  .dot { width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--muted); flex:0 0 auto; }
  .dot.done { border-color:var(--ok); background:var(--ok); color:#fff; }
  .dot.active { border-color:var(--brand); color:var(--brand); }
  .dot.failed { border-color:var(--err); background:var(--err); color:#fff; }
  li.pending { color:var(--muted); } li.done, li.active { color:var(--ink); } li.failed { color:var(--err); }
  .spin { width:12px; height:12px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .foot { font-size:13px; color:var(--muted); }
  .err-detail { color:var(--err); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
  <div class="card">
    <div class="pad">
      <h1>Restore progress</h1>
      <p class="subtle">Updates automatically while the worker runs.</p>
    </div>
    <div class="divider"></div>

    <!-- identity: email, persona, reset session id -->
    <div class="pad">
      <div class="field">
        <div class="label">Account</div>
        <div class="value empty" id="email">—</div>
      </div>
      <div class="field">
        <div class="label">Persona</div>
        <div class="value empty" id="persona">—</div>
      </div>
      <div class="field">
        <div class="label">Reset session</div>
        <div class="value mono empty" id="sid">—</div>
      </div>
    </div>
    <div class="divider"></div>

    <!-- status pill -->
    <div class="pad">
      <div class="rowtop">
        <div class="value empty" id="task" style="font-size:13px;color:var(--muted);font-weight:400">—</div>
        <span class="pill queued" id="pPill">Queued</span>
      </div>
    </div>
    <div class="divider"></div>

    <!-- staged flow -->
    <div class="pad">
      <div class="track queued" id="pTrack"><div id="pFill"></div></div>
      <div class="pcline"><span id="pStatusLabel">Queued</span><span id="pPct">0%</span></div>
      <ul class="steps" id="pSteps"></ul>
    </div>
    <div class="divider"></div>
    <div class="pad">
      <div class="foot" id="pFoot">Waiting for the central reset worker.</div>
      <div class="err-detail" id="pErr"></div>
    </div>
  </div>

<script>
  // session id = last path segment: /reset/status/<id>
  const ID = location.pathname.split("/").filter(Boolean).pop();
  const STEPS = ["Authenticate","Inspect changes","Restore Drive","Restore Gmail","Restore Calendar","Verify baseline","Complete"];
  const $ = id => document.getElementById(id);

  $("sid").textContent = ID || "—"; if(ID) $("sid").classList.remove("empty");

  function setVal(el, text){ if(text){ el.textContent=text; el.classList.remove("empty"); } else { el.textContent="—"; el.classList.add("empty"); } }

  function humanError(e){
    if(!e) return "";
    const s = String(e), low = s.toLowerCase();
    if(low.includes("quota"))          return "Google quota reached for this account — try again after it resets (usually within 24 hours).";
    if(low.includes("invalid_grant") || low.includes("re-authorize") || low.includes("refresherror"))
                                       return "This account's sign-in expired — re-authorize it, then reset again.";
    if(low.includes("timed out") || low.includes("timeout"))
                                       return "The reset took too long / the network stalled — please try again.";
    if(low.includes("config"))         return "Server configuration problem — contact the operator.";
    try { const o = JSON.parse(s); if(o && (o.message || o.error)) return (o.message || o.error); } catch(_){}
    return s.length > 200 ? s.slice(0,200) + "…" : s;
  }

  function stepStates(status){
    switch(status){
      case "completed": return ["done","done","done","done","done","done","done"];
      case "failed":    return ["done","done","failed","failed","failed","pending","pending"];
      case "running":
      case "in_progress": return ["done","done","active","active","active","pending","pending"];
      default:          return ["pending","pending","pending","pending","pending","pending","pending"];
    }
  }
  function pctFor(s){ return s==="completed"?100 : s==="failed"?55 : (s==="running"||s==="in_progress")?60 : 0; }

  function renderSteps(states){
    const ul = $("pSteps"); ul.innerHTML = "";
    STEPS.forEach((name,i)=>{
      const st = states[i] || "pending";
      const li = document.createElement("li"); li.className = st;
      const dot = document.createElement("span"); dot.className = "dot " + st;
      dot.innerHTML = st==="done" ? "✓" : st==="failed" ? "✕" : st==="active" ? '<span class="spin"></span>' : "·";
      const label = document.createElement("span"); label.textContent = name;
      li.appendChild(dot); li.appendChild(label); ul.appendChild(li);
    });
  }

  function renderProgress(status, error){
    const s = (status||"queued").toLowerCase();
    const disp = s==="in_progress" ? "running" : s;
    const pillMap = { queued:"Queued", running:"Running", completed:"Completed", failed:"Failed" };
    $("pPill").className = "pill " + (["queued","running","completed","failed"].includes(disp)?disp:"queued");
    $("pPill").textContent = pillMap[disp] || "Queued";
    const pct = pctFor(s);
    $("pFill").style.width = pct + "%";
    $("pTrack").className = "track " + (["queued","running","completed","failed"].includes(disp)?disp:"queued");
    $("pStatusLabel").textContent = pillMap[disp] || "Queued";
    $("pPct").textContent = pct + "%";
    renderSteps(stepStates(disp==="running"?"running":s));
    if (disp==="completed"){ $("pFoot").textContent = "Environment restored to baseline."; }
    else if (disp==="failed"){ $("pFoot").textContent = "Reset did not complete — " + (humanError(error) || "please try again.");
      $("pErr").textContent = error && humanError(error) !== String(error) ? ("Details: " + String(error).slice(0,240)) : ""; }
    else if (disp==="running"){ $("pFoot").textContent = "Restoring environment…"; }
    else { $("pFoot").textContent = "Waiting for the central reset worker."; }
  }

  async function poll(){
    try {
      const r = await fetch("/ui/reset/" + encodeURIComponent(ID), {cache:"no-store"});
      if (r.status === 404){ $("pFoot").textContent = "Unknown reset session id."; $("pPill").className="pill failed"; $("pPill").textContent="Not found"; return; }
      const d = await r.json();
      setVal($("email"), d.email);
      setVal($("persona"), d.persona);
      setVal($("task"), d.task_allocation_id ? ("Task " + d.task_allocation_id + (d.mode ? "  ·  mode " + d.mode : "")) : "");
      renderProgress(d.status, d.error);
      const st = (d.status||"").toLowerCase();
      if (st==="completed" || st==="failed") return;
    } catch(e){ /* transient; keep polling */ }
    setTimeout(poll, 2000);
  }
  poll();
</script>
</body>
</html>
