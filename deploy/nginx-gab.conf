# nginx reverse proxy for the GAB platform.
# TLS is terminated here; the app stays on 127.0.0.1:8791 (never public).
#
# Install:
#   1. Edit YOUR_DOMAIN below.
#   2. sudo cp deploy/nginx-gab.conf /etc/nginx/sites-available/gab
#      sudo ln -s /etc/nginx/sites-available/gab /etc/nginx/sites-enabled/gab
#      sudo rm -f /etc/nginx/sites-enabled/default
#      sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d YOUR_DOMAIN
#      (certbot rewrites this file to add the 443 server + auto-renew.)

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Uploads (client.json, CSV) can be a few MB; allow headroom.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A full seed can run for many minutes; don't cut the request short.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
